name: Sonar Bekçi
# Düzenli kontrol bekci_dongu.yml'de. Bu iş yalnız elle çalıştırma / kuyruğa elle ekleme içindir.
on:
  workflow_dispatch:
    inputs:
      ekle:
        description: 'Kuyruğa elle ekle (ör. ANHYT:1687664)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: bekci
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: KAP kontrolü
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          KUYRUGA_EKLE: ${{ inputs.ekle }}
        run: python3 bekci/bekci.py
      - name: Durumu kaydet
        run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add bekci/
          ADDED=$(git diff --cached --numstat | awk '{s+=$1} END {print s+0}')
          FILES=$(git diff --cached --name-only | grep -v '^bekci/state.json$' | wc -l)
          if [ "$FILES" -gt 0 ] || [ "$ADDED" -gt 2 ]; then
            git commit -q -m "Bekçi durumu [skip render]"
            for n in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
