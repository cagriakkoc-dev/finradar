name: FinRadar Bekçi
on:
  schedule:
    - cron: '*/10 5-20 * * *'
    - cron: '7 21,22,23,0,1,2,3,4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bekci
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: KAP kontrolü
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 bekci/bekci.py
      - name: Durumu kaydet
        run: |
          if ! git diff --quiet bekci/state.json 2>/dev/null || [ -n "$(git status --porcelain bekci/state.json)" ]; then
            if git diff --stat bekci/state.json | grep -q '|' || [ -n "$(git status --porcelain bekci/state.json | grep '??')" ]; then
              git config user.name "FinRadar Bekçi"; git config user.email "bekci@users.noreply.github.com"
              git add bekci/state.json
              if git diff --cached --numstat | awk '{s+=$1} END {exit !(s>2)}'; then
                git commit -q -m "Bekçi durumu [skip render]" && git push -q
              fi
            fi
          fi
