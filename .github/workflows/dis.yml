name: Dış veri çek
on:
  workflow_dispatch:
    inputs:
      dis:
        description: 'ad|url;;ad|url'
        required: true
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          DIS: ${{ inputs.dis }}
        run: python3 bekci/araclar/dis_cek.py
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add bekci/dis
          git diff --cached --quiet || (git commit -q -m "Dış veri [skip render]" && for n in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done)
