name: KAP PDF metni
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Bildirim numaraları (virgülle)'
        required: true
      kelime:
        description: 'Sayfa seçme düzenli ifadesi'
        required: false
        default: 'Yurt içi satış|Yurt dışı satış'
      yeniden:
        description: 'Var olanı yeniden üret (1)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - env:
          IDS: ${{ inputs.ids }}
          KELIME: ${{ inputs.kelime }}
          YENIDEN: ${{ inputs.yeniden }}
        run: python3 bekci/araclar/kap_pdf_metin.py
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add bekci/metin
          git diff --cached --quiet || (git commit -q -m "KAP PDF metni [skip render]" && for n in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done)
