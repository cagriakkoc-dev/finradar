<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sonar · Yönetim</title>
<link rel="icon" href="marka/favicon.svg">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#d8dee8;--fg:#121a26;--muted:#5a6678;--accent:#0B2545;--teal:#19C3B1;--err:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--panel:#151c27;--line:#273243;--fg:#e7ecf3;--muted:#8a97aa;--accent:#7cc4ff;--err:#ff7d6e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.brand b{font-size:20px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--teal);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0f141c}}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--muted)}
.msg.err{color:var(--err)}
a{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="brand"><svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="15" fill="#0B2545"/><path stroke="#fff" fill="none" stroke-width="2.5" stroke-linecap="round" d="M20 33V50M32 26V50"/><rect x="16.5" y="38" width="7" height="8" rx="2" fill="#fff"/><rect x="28.5" y="30" width="7" height="12" rx="2" fill="#fff"/><path stroke="#19C3B1" fill="none" stroke-width="2.5" stroke-linecap="round" d="M44 14V50"/><rect x="40" y="19" width="8" height="20" rx="2" fill="#19C3B1"/></svg>
    <div><b>sonar</b><small>Yönetim paneli</small></div></div>
  <input type="text" name="username" value="sonar" autocomplete="username" hidden>
  <label for="p">Şifre</label>
  <input type="password" id="p" autocomplete="current-password" required autofocus>
  <div class="row"><input type="checkbox" id="r"><label for="r" style="margin:0">Bu cihazda hatırla</label></div>
  <button id="b">Giriş</button>
  <div class="msg" id="m" role="status"></div>
  <p style="margin:14px 0 0"><a href="./">← Siteye dön</a></p>
</form>
<script>
(()=>{
const ITER=310000,SALT=new TextEncoder().encode('sonar-yonetim-paneli-v1'),SK='sonar-yonetim-k';
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=s=>document.querySelector(s);
async function derive(p){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:ITER,hash:'SHA-256'},k,256))}
async function open_(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const r=await fetch('yonetim.bin',{cache:'no-store'});if(!r.ok)throw new Error('dosya');
  const b=new Uint8Array(await r.arrayBuffer());
  const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
  const P=JSON.parse(new TextDecoder().decode(d));
  const inj=`<meta name="robots" content="noindex,nofollow"><script>window.__SP=${JSON.stringify({k:b64(raw),f:P.files})};<\/script><script>(${hook.toString()})();<\/script>`;
  const html=P.html.replace(/<head([^>]*)>/i,m=>m+inj);
  document.open();document.write(html);document.close();
}
function hook(){
  const SP=window.__SP,cache={};
  const kp=crypto.subtle.importKey('raw',Uint8Array.from(atob(SP.k),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt']);
  const MT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',svg:'image/svg+xml',webp:'image/webp',gif:'image/gif',pdf:'application/pdf',txt:'text/plain;charset=utf-8',md:'text/markdown;charset=utf-8'};
  const rel=u=>{try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;const p=decodeURIComponent(x.pathname.replace(/^\//,''));return SP.f[p]?p:null}catch(e){return null}};
  const blob=p=>cache[p]||(cache[p]=(async()=>{const b=new Uint8Array(await (await fetch('y/'+SP.f[p]+'.bin')).arrayBuffer());const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},await kp,b.slice(12));return URL.createObjectURL(new Blob([d],{type:MT[p.split('.').pop().toLowerCase()]||'application/octet-stream'}))})());
  const fix=el=>{if(!el.getAttribute)return;for(const a of ['src','href']){const v=el.getAttribute(a);if(!v||v.startsWith('blob:')||v.startsWith('#'))continue;const p=rel(v);if(!p)continue;el.removeAttribute(a);if(a==='href'&&el.hasAttribute('download')&&!el.getAttribute('download'))el.setAttribute('download',p.split('/').pop());blob(p).then(u=>el.setAttribute(a,u)).catch(()=>{})}};
  const scan=n=>{if(n.nodeType!==1)return;if(n.matches('img,a,source'))fix(n);n.querySelectorAll&&n.querySelectorAll('img[src],a[href],source[src]').forEach(fix)};
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(scan)})).observe(document,{subtree:true,childList:true,attributes:true,attributeFilter:['src','href']});
  addEventListener('DOMContentLoaded',()=>{scan(document.documentElement);
    const bar=document.createElement('div');bar.id='ypanel';
    bar.innerHTML='<b>Yönetim paneli</b><span>Taslaklar ve geliştirici notları yalnız burada görünür.</span><a href="./" target="_blank" rel="noopener">Açık siteyi gör ↗</a><button type="button" id="ycik">Çıkış</button>';
    bar.style.cssText='position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);padding:8px 12px;border-radius:12px;background:#0B2545;color:#fff;font:600 12px/1.4 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.25)';
    bar.querySelectorAll('a,button').forEach(x=>x.style.cssText='color:#19C3B1;background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:underline');
    bar.querySelector('span').style.cssText='font-weight:400;opacity:.8';
    document.body.appendChild(bar);
    bar.querySelector('#ycik').onclick=()=>{try{localStorage.removeItem('sonar-yonetim-k');sessionStorage.removeItem('sonar-yonetim-k')}catch(e){}location.replace('yonetim.html')}});
}
(async()=>{let s=null;try{s=sessionStorage.getItem(SK)||localStorage.getItem(SK)}catch(e){}
  if(s){$('#m').textContent='Açılıyor…';try{await open_(unb64(s));return}catch(e){try{sessionStorage.removeItem(SK);localStorage.removeItem(SK)}catch(_){}$('#m').textContent=''}}
})();
$('#f').onsubmit=async e=>{e.preventDefault();const btn=$('#b'),m=$('#m');btn.disabled=true;m.className='msg';m.textContent='Kontrol ediliyor…';
  try{const raw=await derive($('#p').value);await (async()=>{try{(($('#r').checked)?localStorage:sessionStorage).setItem(SK,b64(raw))}catch(_){}})();await open_(raw)}
  catch(err){try{sessionStorage.removeItem(SK);localStorage.removeItem(SK)}catch(_){}m.className='msg err';m.textContent=err&&err.message==='dosya'?'Panel dosyası yüklenemedi.':'Şifre yanlış.';btn.disabled=false}};
})();
</script>
</body>
</html>
